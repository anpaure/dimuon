[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dimuon-optimizer"
version = "0.1.0"
description = "PyTorch implementation of the recovered Dimuon optimizer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch==2.14.1", "numpy>=1.26"]

[tool.setuptools]
py-modules = ["dimuon"]
